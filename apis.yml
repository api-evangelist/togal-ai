aid: togal-ai
name: Togal.AI
description: >-
  Togal.AI is a Miami, Florida construction-technology company building
  AI-powered takeoff and estimating software for the architecture, engineering,
  and construction (AEC) industry. Founded by former U.S. Congressman Patrick
  Murphy out of his family's multi-generational construction business, the
  cloud-based platform applies computer-vision and deep-learning models to
  architectural drawings and blueprints to automatically detect, measure,
  count, label, and compare project spaces and features — reporting up to 98%
  accuracy against AIA measurement standards and reducing manual estimating
  effort by roughly 80%. Signature capabilities include the Togal Button
  (one-click automated takeoff), AI-powered image, text, and pattern search
  across plan sets, drawing-set comparison for change quantification, real-
  time multi-user cloud collaboration, and Togal.CHAT, a natural-language
  assistant that lets estimators query plans, verify quantities, identify
  errors, and draft RFPs. The product serves drywall, electrical, mechanical,
  plumbing, glazing, landscaping, painting, FF&E, and general-contracting
  trades, with documented case studies (e.g., Coastal Construction) showing
  multi-hour-per-plan-set savings and seven-figure annual ROI. Togal.AI's
  revenue model is SaaS subscriptions sold to estimators, subcontractors, and
  general contractors; there is no public developer API, SDK, or open-source
  release, and the only known third-party integration is Service Titan plus
  data export to Excel and downstream estimating tools.
